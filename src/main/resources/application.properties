spring.application.name=bikes
# LOCALE config
spring.web.locale-resolver=fixed
spring.web.locale=pt_BR

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Profile ativo: 'h2' permite executar a aplicação imediatamente em memória (sem depender do MySQL local);
# altere para 'mysql' quando o serviço MySQL local estiver configurado.
spring.profiles.active=h2

# JPA
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=false

# JWT
app.jwt.secret=change-this-secret-key-to-a-long-random-value-at-least-32-bytes-2026-bikes
app.jwt.expiration-ms=86400000

# ADMIN inicial (o cadastro publico cria apenas perfil CLIENTE)
app.admin.username=admin@bikes.com
app.admin.password=123456

# SWAGGER
springdoc.swagger-ui.path=/docs-bikes.html
springdoc.api-docs.path=/docs-bikes
springdoc.packages-to-scan=br.edu.ifc.bikes.web.controller

#---
spring.config.activate.on-profile=h2

# H2 Config
spring.datasource.url=jdbc:h2:mem:bikes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#---
spring.config.activate.on-profile=mysql

# MYSQL Config
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bikes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
